document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

800;font-size:56px;line-height:1.05;letter-spacing:-0.02em;max-width:1100px;text-wrap:pretty;\">SaaS Negotiation, Implementation, Product Setup &amp; Operational Training<\u002Fh1>\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:23px;line-height:1.35;color:#9FC6E6;max-width:900px;text-wrap:pretty;\">Supporting your entry into the Brazilian market — from provider negotiation to a fully configured platform and an independent team.<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:26px;border-top:1px solid rgba(255,255,255,0.18);padding-top:30px;margin-top:12px;\">\n<div style=\"display:flex;flex-direction:column;gap:7px;\"><div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#7C9BC4;\">Client<\u002Fdiv><div style=\"font-size:17px;font-weight:700;\">Moonrise Tourism<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px;\"><div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#7C9BC4;\">Service provider<\u002Fdiv><div style=\"font-size:17px;font-weight:700;\">B2 Consulting<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px;\"><div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#7C9BC4;\">Scope<\u002Fdiv><div style=\"font-size:17px;font-weight:700;\">Negotiation + Platform Setup + 10 Tours + Training<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px;\"><div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#7C9BC4;\">Date<\u002Fdiv><div style=\"font-size:17px;font-weight:700;\">21/10/2026<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<nav style=\"position:sticky;top:0;z-index:12;background:#FFFFFF;border-bottom:1px solid #E3EBF4;\">\n<div style=\"max-width:1280px;margin:0 auto;padding:12px 32px;display:flex;gap:8px;flex-wrap:wrap;\">\n<a href=\"#objective\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Objective<\u002Fa>\n<a href=\"#negotiation\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Negotiation &amp; setup<\u002Fa>\n<a href=\"#tours\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Tours &amp; training<\u002Fa>\n<a href=\"#deliverables\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Deliverables<\u002Fa>\n<a href=\"#assumptions\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Assumptions<\u002Fa>\n<a href=\"#timeline\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Timeline<\u002Fa>\n<a href=\"#investment\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Investment<\u002Fa>\n<a href=\"#additional\" style=\"padding:7px 14px;border:1px solid #DCE7F2;border-radius:999px;background:#FFFFFF;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;color:#143A6B;\" style-hover=\"background:#EAF1F8;border-color:#3AA3DC\">Additional services &amp; validity<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n\n<section id=\"objective\" style=\"background:#FFFFFF;border-bottom:1px solid #E3EBF4;scroll-margin-top:84px;\">\n<div style=\"max-width:1280px;margin:0 auto;padding:88px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:72px;align-items:start;\">\n<div style=\"display:flex;flex-direction:column;gap:24px;\">\n<div style=\"display:flex;align-items:center;gap:14px;\"><div style=\"width:34px;height:3px;background:#3AA3DC;\"><\u002Fdiv><div style=\"font-size:12px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;color:#1B5FA8;\">01 · Objective<\u002Fdiv><\u002Fdiv>\n<h2 style=\"margin:0;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:700;font-size:36px;line-height:1.15;color:#10233F;text-wrap:pretty;\">Entering the Brazilian market with the right technology partner<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.6;color:#54678A;text-wrap:pretty;\">To support the Client's entry into the Brazilian market by assisting with negotiations and onboarding with a local tourism technology provider, configuring the SaaS platform, preparing and registering tours, and training the Client's team to operate the system independently.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;\">\n<div style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600;color:#1B5FA8;margin-bottom:10px;\">The project covers<\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:9px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:17px;line-height:1.4;color:#10233F;\">Negotiation support with the selected Brazilian SaaS provider<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:9px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:17px;line-height:1.4;color:#10233F;\">Initial configuration of the SaaS platform<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:9px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:17px;line-height:1.4;color:#10233F;\">Preparation and registration of up to 10 tours, ready for sale<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:9px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:17px;line-height:1.4;color:#10233F;\">Up to two remote operational training sessions<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:9px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:17px;line-height:1.4;color:#10233F;\">Guidance for independent operation of the platform<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"negotiation\" style=\"background:#F7F9FC;border-bottom:1px solid #E3EBF4;scroll-margin-top:84px;\">\n<div style=\"max-width:1280px;margin:0 auto;padding:88px 32px;display:flex;flex-direction:column;gap:34px;\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:920px;\"><div style=\"font-size:12px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;color:#1B5FA8;\">02 · Scope of services<\u002Fdiv><h2 style=\"margin:0;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:700;font-size:36px;line-height:1.15;color:#10233F;text-wrap:pretty;\">Provider negotiation and platform configuration<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;\">\n<div style=\"background:#FFFFFF;border:1px solid #E3EBF4;border-top:4px solid #3AA3DC;border-radius:0 0 10px 10px;padding:30px 28px;display:flex;flex-direction:column;gap:16px;\">\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:800;font-size:20px;color:#3AA3DC;\">2.1<\u002Fdiv>\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:700;font-size:24px;line-height:1.2;color:#10233F;\">SaaS Provider Negotiation Support<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.5;color:#54678A;text-wrap:pretty;\">B2 Consulting will support the Client throughout the commercial and operational discussions with the selected Brazilian SaaS provider, including:<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;\">\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Supporting commercial negotiations and discussions<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Identifying and clarifying the Client's business and operational requirements<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Reviewing proposed service terms and scope<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Clarifying platform capabilities, limitations, and workflows<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Aligning the Client's business needs with the platform's available functionalities<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Coordinating discussions and next steps with the SaaS provider<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#EAF1F8;border-radius:10px;padding:15px 17px;font-size:15px;line-height:1.45;color:#143A6B;text-wrap:pretty;\">The Client retains full responsibility for the final contracting decision and will pay all SaaS subscription, licensing, and provider fees directly to the SaaS provider.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #E3EBF4;border-top:4px solid #3AA3DC;border-radius:0 0 10px 10px;padding:30px 28px;display:flex;flex-direction:column;gap:16px;\">\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:800;font-size:20px;color:#3AA3DC;\">2.2<\u002Fdiv>\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:700;font-size:24px;line-height:1.2;color:#10233F;\">Initial Platform Configuration<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.5;color:#54678A;text-wrap:pretty;\">Following the SaaS contract and the provision of the necessary access credentials, B2 Consulting will perform the initial platform configuration, including:<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;\">\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Configuration of available operational parameters<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Organization of the platform environment<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Setup of the resources required to manage tours<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Configuration of available native features relevant to the Client's operations<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Validation of initial settings and operational workflows<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#EAF1F8;border-radius:10px;padding:15px 17px;font-size:15px;line-height:1.45;color:#143A6B;text-wrap:pretty;\">All configuration activities are limited to the platform's existing capabilities and standard functionalities.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tours\" style=\"background:#FFFFFF;border-bottom:1px solid #E3EBF4;scroll-margin-top:84px;\">\n<div style=\"max-width:1280px;margin:0 auto;padding:88px 32px;display:flex;flex-direction:column;gap:34px;\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:920px;\"><div style=\"font-size:12px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;color:#1B5FA8;\">02 · Scope of services (cont.)<\u002Fdiv><h2 style=\"margin:0;font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:700;font-size:36px;line-height:1.15;color:#10233F;text-wrap:pretty;\">Up to 10 tours ready for sale, and a team ready to run them<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;\">\n<div style=\"background:#F7F9FC;border:1px solid #E3EBF4;border-top:4px solid #3AA3DC;border-radius:0 0 10px 10px;padding:30px 28px;display:flex;flex-direction:column;gap:16px;\">\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:800;font-size:20px;color:#3AA3DC;\">2.3<\u002Fdiv>\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:700;font-size:24px;line-height:1.2;color:#10233F;\">Tour Preparation and Setup<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.5;color:#54678A;text-wrap:pretty;\">B2 Consulting will personally prepare, register, and configure <strong style=\"color:#10233F;\">up to 10 tours<\u002Fstrong> in the SaaS platform, aiming to leave them registered, configured, and ready for commercial sale within the platform's available capabilities. This includes:<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;\">\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Reviewing and organizing the information supplied by the Client<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Preparing the product information for registration<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Registering and configuring up to 10 tours<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Entering itineraries, descriptions, inclusions, exclusions, and other relevant product details<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Entering prices, commercial conditions, and other commercial information based on data supplied and approved by the Client<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Configuring available product options and operational parameters<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#3AA3DC;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Reviewing the registered information and validating the setup<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#EAF1F8;border-radius:10px;padding:15px 17px;font-size:15px;line-height:1.45;color:#143A6B;text-wrap:pretty;display:flex;flex-direction:column;gap:8px;\"><div style=\"font-weight:600;\">Client responsibilities<\u002Fdiv><div>The Client must provide accurate and complete source information, including tour details, itineraries, descriptions, prices, commercial conditions, images, and any other required materials. The Client is responsible for reviewing and approving the final product information, pricing, and commercial conditions, as well as the accuracy of the source data provided.<\u002Fdiv><div>Substantial content creation, translation, image production, and independent sourcing of missing product information are not included unless separately agreed in writing. Tours exceeding the included limit will be quoted separately.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#F7F9FC;border:1px solid #E3EBF4;border-top:4px solid #143A6B;border-radius:0 0 10px 10px;padding:30px 28px;display:flex;flex-direction:column;gap:16px;\">\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:800;font-size:20px;color:#143A6B;\">2.4<\u002Fdiv>\n<div style=\"font-family:'Figtree',Helvetica,Arial,sans-serif;font-weight:700;font-size:24px;line-height:1.2;color:#10233F;\">Operational Training<\u002Fdiv>\n<div style=\"font-size:16px;line-height:1.5;color:#54678A;text-wrap:pretty;\">B2 Consulting will provide up to <strong style=\"color:#10233F;\">two remote training sessions<\u002Fstrong>, each lasting a maximum of two hours. The sessions will cover:<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;\">\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#143A6B;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Introduction to the platform and its main functionalities<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#143A6B;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Core operational workflows<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#143A6B;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Tour consultation, management, and updates<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#143A6B;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Maintenance of product information<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#143A6B;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Questions and answers<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #E3EBF4;\"><div style=\"width:7px;height:7px;margin-top:8px;background:#143A6B;flex:none;\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.4;color:#10233F;\">Best practices for independent plat
